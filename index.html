<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Typing Speed Test</title>
  <link rel="icon" href="./src/pictures/favicon-32x32.png" type="image/png">

  <link rel="stylesheet" href="./src/styles/main.css">

  <script type="module" src="./src/scripts/main.js"></script>
</head>

<body>
  <header class="header container">
    <div class="logo">
      <img src="./src/pictures/logo-large.svg" alt="Typing Speed Test" width="267" height="40">
    </div>
    <div class="best">
      <img src="./src/pictures/icon-personal-best.svg" width="21" height="18" alt="">
      <span class="regular s n1">Personal Best: <span class="regular s n0" id="best"></span></span>
    </div>
  </header>
  <main class="container">
    <div class="home-top">
      <div class="stats separator">
        <span class="regular m n1">WPM: <span class="bold m n0" id="wpm"></span></span>
        <span class="regular m n1">Accuracy: <span class="bold m n0" id="acc"></span></span>
        <span class="regular m n1">Time: <span class="bold m n0" id="time"></span></span>
      </div>
      <div class="settings separator">
        <div class="difficulty" id="difficulty" role="radiogroup" aria-labelledby="difficulty-title">
          <span class="regular s n1" id="difficulty-title">Difficulty:</span>
          <ul>
            <li>
              <input type="radio" name="difficulty" id="easy">
              <label for="easy" class="regular s n0">Easy</label>
            </li>
            <li>
              <input type="radio" name="difficulty" id="medium">
              <label for="medium" class="regular s n0">Medium</label>
            </li>
            <li>
              <input type="radio" name="difficulty" id="hard">
              <label for="hard" class="regular s n0">Hard</label>
            </li>
          </ul>
        </div>
        <div class="mode" id="mode" role="radiogroup" aria-labelledby="mode-title">
          <span class="regular s n1" id="mode-title">Mode:</span>
          <ul>
            <li>
              <input type="radio" name="mode" id="60s">
              <label for="60s" class="regular s n0">Timed (60s)</label>
            </li>
            <li>
              <input type="radio" name="mode" id="pass">
              <label for="pass" class="regular s n0">Passage</label>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div class="main-home pending">
      <p class="regular l n1" id="text"></p>
      <div class="home-bottom">
        <button class="button-1 medium m n0" onclick="window.location.reload()">Restart Test <img src="./src/pictures/icon-restart.svg" alt=""></button>
      </div>
      <div class="pending-content">
        <button class="button-3 medium m n0">Start Typing Test</button>
        <span class="medium m n0">Or click the text and start typing</span>
      </div>
    </div>
  </main>
  <footer class="footer">
    <span class="regular s n1">Developed by <a href="https://www.linkedin.com/in/nathalia-dagort-ferlin/">Nathália Dagort Ferlin</a>.</span>
  </footer>
</body>

</html>
